name: tfmc-staging

services:
  backend:
    # Reaps the renderer's Chromium processes.
    init: true
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Host 8001 is often taken; use 18001 for staging
      - "18001:8000"
    environment:
      - SKINS_DEV=1
      - STAFF_KEY=dev-staff-key
      - PLUGIN_KEY=dev-plugin-key
      # All site records. Staging keeps its own database.
      - DATABASE_URL=postgresql://provincesystem:${POSTGRES_PASSWORD:-dev-postgres}@db:5432/provincesystem
    volumes:
      - ./backend/src/output:/app/src/output
      - ./backend/src/input:/app/src/input
      - ./backend/src/defines:/app/src/defines
      - ./backend/src/data:/app/src/data
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=provincesystem
      - POSTGRES_DB=provincesystem
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev-postgres}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "provincesystem", "-d", "provincesystem"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    init: true
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:18001
    ports:
      - "13001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db:
