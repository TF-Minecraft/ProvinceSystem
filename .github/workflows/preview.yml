name: Preview

# Every branch except main gets its own copy of the site at
# https://<branch>.tfminecraft.net, built from that branch alone. The server
# stops it 90 minutes after the last deploy: push again, or run this workflow
# on the branch, to bring it back. Deleting the branch removes it at once.

on:
  push:
    branches-ignore: [main, 'dependabot/**']
  workflow_dispatch:
  delete:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/tf-minecraft/provincesystem-preview

jobs:
  deploy:
    if: github.event_name != 'delete' && github.ref_type == 'branch' && github.ref_name != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    environment:
      name: preview
      url: ${{ steps.slug.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: slug
        run: python3 .github/scripts/preview_slug.py "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ steps.slug.outputs.slug }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=preview-backend
          cache-to: type=gha,scope=preview-backend,mode=max
      - name: Build frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          provenance: false
          # The browser calls the preview's own /api, which the router sends to its backend.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.slug.outputs.url }}/api
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.slug.outputs.slug }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=preview-frontend
          cache-to: type=gha,scope=preview-frontend,mode=max
      - name: Start the preview
        env:
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          status=0
          .github/scripts/preview_ssh.sh up "$SLUG" "$GITHUB_SHA" || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::error::Four previews are already running. Delete a finished branch, or stop one on the server with: sudo -u tfmc ps-preview down <slug>"
          fi
          exit "$status"
      - name: Summary
        env:
          URL: ${{ steps.slug.outputs.url }}
        run: |
          {
            echo "### Preview: $URL"
            echo
            echo "Built from \`${GITHUB_SHA::7}\`. It stops 90 minutes after this deploy; push again or re-run this workflow to restart it."
            echo "Sign in to the preview with the shared \`preview\` login. Discord sign-in is off on previews."
          } >> "$GITHUB_STEP_SUMMARY"

  teardown:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: slug
        # A branch that could not have a preview has nothing to remove.
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.ref }}
        run: python3 .github/scripts/preview_slug.py "$BRANCH"
      - name: Remove the preview
        if: steps.slug.outcome == 'success'
        env:
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          PREVIEW_SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: .github/scripts/preview_ssh.sh down "$SLUG"
