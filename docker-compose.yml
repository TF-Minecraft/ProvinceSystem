services:
  backend:
    # Reaps the renderer's Chromium processes.
    init: true
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src/output:/app/src/output
      - ./backend/src/input:/app/src/input
      - ./backend/src/defines:/app/src/defines
      - ./backend/src/data:/app/src/data
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: always

  # The site's Postgres (Precedent and patch notes). backend/.env sets
  # DATABASE_URL=postgresql://provincesystem:<POSTGRES_PASSWORD>@db:5432/provincesystem;
  # the password comes from the project's .env.
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: provincesystem
      POSTGRES_DB: provincesystem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "provincesystem", "-d", "provincesystem"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: always

  frontend:
    init: true
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Public URL browsers use (nginx /api/ → backend :8000). Override at build time if needed.
        NEXT_PUBLIC_API_URL: https://www.tfminecraft.net/api
        # Season 5 maintenance landing; staff redeem character code + tfmc.map.staff
        NEXT_PUBLIC_SITE_DEV_GATE: "0"
        # Arms the prebuild guard: refuses the build if NEXT_PUBLIC_CHARACTER_UI_DEV=1
        PS_PRODUCTION: "1"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: always

volumes:
  db:
